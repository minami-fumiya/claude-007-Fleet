<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a0a0f" />
    <title>WW2 Naval Fleet</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; background: #0a0a0f; overflow: hidden; overscroll-behavior: none; }
      body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #game { width: 100vw; height: 100vh; height: 100dvh; }
      #rotate-hint {
        display: none; position: fixed; inset: 0; z-index: 10;
        align-items: center; justify-content: center; text-align: center;
        background: #0a0a0f; color: #ffffff; font: 18px/1.6 sans-serif; padding: 16px;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #rotate-hint { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate-hint">📱 端末を横向きにしてプレイしてください<br />Rotate your device to landscape</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
